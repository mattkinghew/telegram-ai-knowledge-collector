# Validate against https://render.com/docs/blueprint-spec before external use.
# This file is preparation only. Blueprint sync creates billable resources.
previews:
  generation: off

services:
  - type: web
    name: p1-5-capture-staging
    runtime: python
    region: singapore
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: off
    buildCommand: python -m pip install -e ".[hybrid]"
    startCommand: python -m uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: p1-5-staging-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: APP_ENV
        value: production
      - key: AI_PROVIDER
        value: mock
      - key: ENABLE_LIVE_AI
        value: "false"
      - key: AUTH_MODE
        value: token
      - key: API_AUTH_TOKEN
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        value: sqlite:////opt/render/project/src/data/p1_5_capture.sqlite3
