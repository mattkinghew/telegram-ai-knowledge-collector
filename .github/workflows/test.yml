name: Test Business Knowledge Capture

on:
  pull_request:
  push:
    branches:
      - release/business-knowledge-capture-p1

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q src tests
      - name: Unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: CLI help smoke test
        run: PYTHONPATH=src python -m business_knowledge_capture.cli --help
