[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "business-knowledge-capture"
version = "0.1.0"
description = "Protected-path-aware Obsidian inbox capture and progress reporting CLI"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
hybrid = [
    "fastapi==0.123.9",
    "uvicorn==0.36.1",
]
test = ["httpx==0.28.1"]

[project.scripts]
bkc = "business_knowledge_capture.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
